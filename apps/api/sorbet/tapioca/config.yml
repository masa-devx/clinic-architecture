gem:
  # Add your `gem` command parameters here:
  #
  # exclude:
  # - gem_name
  # doc: true
  # workers: 5
dsl:
  # Rails の RBI は、テストの環境で作る（CI はテストの DB しか作らない）。開発の環境だけのルート（rails_info など）は、型に入れない
  environment: test
  # Rails の中のコントローラー。CI（eager_load あり）でだけ読み込まれ、中身が空の RBI ができて、手元と CI で結果が変わるので作らない
  skip_constant:
    - Rails::ApplicationController
    - Rails::HealthController
  # Add your `dsl` command parameters here:
  #
  # exclude:
  # - SomeGeneratorName
  # workers: 5
