  id: ID!
  name: String!
}

"""
使う人が直せるエラーの種類
"""
enum ErrorCode {
  """
  キャンセル・変更できる期限を過ぎている
  """
  CANCEL_DEADLINE_PASSED

  """
  ほかの操作とぶつかった。もう一度試せば通ることがある
  """
  CONFLICT

  """
  メールアドレスかパスワードが違う
  """
  INVALID_CREDENTIALS

  """
  入力に誤りがある
  """
  INVALID_INPUT

  """
  今の状態では、その操作はできない
  """
  INVALID_STATE

  """
  対象が見つからない（ほかの医療機関・ほかの人のものも、見つからないとして返す）
  """
  NOT_FOUND

  """
  見えているが、その操作はできない
  """
  NOT_PERMITTED

  """
  受付できる時間の外
  """
  OUTSIDE_TIME_WINDOW

  """
  枠がすでに埋まっている
  """
  SLOT_TAKEN

  """
  枠の時刻を過ぎたか、閉じられていて、予約できない
  """
  SLOT_UNAVAILABLE
}

