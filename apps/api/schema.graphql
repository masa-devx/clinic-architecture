}

type Mutation {
  """
  空いている診療枠を予約する。事務スタッフは、患者のメールアドレスを指定して、代わりに入れる
  """
  bookAppointment(
    """
    事務スタッフが代わりに入れるときの、患者のメールアドレス
    """
    patientEmail: String
    slotId: ID!
  ): BookAppointmentPayload!

  """
  予約をキャンセルする
  """
  cancelAppointment(appointmentId: ID!): CancelAppointmentPayload!

  """
  受付（チェックイン）をする
  """
  checkIn(appointmentId: ID!): CheckInPayload!

  """
  診療枠を閉じる（予約が入っていない枠だけ）
  """
  closeSlot(slotId: ID!): CloseSlotPayload!

  """
  会計を確定する。確定したあとは、明細を変えられない
  """
  confirmBill(billId: ID!): ConfirmBillPayload!

  """
  診療枠をまとめて作る。すでにある枠・時間が重なる枠は飛ばす
  """
  createSlots(input: CreateSlotsInput!): CreateSlotsPayload!

  """
  診察を終える。会計の下書きができる
  """
  finishConsultation(appointmentId: ID!): FinishConsultationPayload!

  """
  ログアウト。ログインしていなくても成功する
  """
  logout: LogoutPayload!

  """
  会計を、支払い済にする（窓口で受け取ったことを記録する）
  """
  markBillPaid(billId: ID!): MarkBillPaidPayload!

  """
  患者のログイン
  """
  patientLogin(email: String!, password: String!): PatientLoginPayload!

  """
  会計を、返金済にする（全額）
  """
  refundBill(billId: ID!): RefundBillPayload!

  """
  予約の時刻を変える（同じ医療機関の、空いている枠へ付け替える）
  """
  rescheduleAppointment(appointmentId: ID!, slotId: ID!): RescheduleAppointmentPayload!

  """
  問診の答えを保存する。submit が false なら途中まで保存、true なら提出（必須の質問を確かめる）
  """
  saveQuestionnaire(answers: [QuestionnaireAnswerInput!]!, appointmentId: ID!, submit: Boolean!): SaveQuestionnairePayload!

  """
  スタッフ（医師・事務スタッフ）のログイン
  """
  staffLogin(email: String!, password: String!): StaffLoginPayload!

  """
  診察を始める
  """
  startConsultation(appointmentId: ID!): StartConsultationPayload!

  """
  会計の下書きの明細を、入れ直す
  """
  updateBillItems(billId: ID!, items: [BillItemInput!]!): UpdateBillItemsPayload!
}

