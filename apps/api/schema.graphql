  """
  edges: [AuditLogEdge]

  """
  A list of nodes.
  """
  nodes: [AuditLog]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type AuditLogEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: AuditLog
}

"""
会計
"""
type Bill {
  appointment: Appointment!
  billedAt: ISO8601DateTime

  """
  今、ログインしている人が、明細の変更・確定・支払い済・返金をできるか
  """
  canManage: Boolean!
  id: ID!
  items: [BillItem!]!
  paidAt: ISO8601DateTime
  refundedAt: ISO8601DateTime
  status: BillStatus!

  """
  合計（円）。確定のときに決まる。作成中は null
  """
  totalAmount: Int
}

"""
会計の明細。名前と値段は、作った時の料金の表から写したもの
"""
type BillItem {
  """
  単価 × 数量（円）
  """
  amount: Int!
  id: ID!
  name: String!
  quantity: Int!

  """
  円
  """
  unitPrice: Int!
}

"""
会計の明細の1行（料金の表の項目と、数量）
"""
input BillItemInput {
  feeItemId: ID!
  quantity: Int!
}

enum BillStatus {
  """
  請求済
  """
  BILLED

  """
  作成中
  """
  DRAFT

  """
  支払い済
  """
  PAID

  """
  返金済
  """
  REFUNDED
}

