  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type AppointmentEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: Appointment
}

"""
予約の一覧の絞り込み。日付は日本時間で、from・to の日を含む
"""
input AppointmentFilter {
  doctorId: ID
  from: ISO8601Date
  status: AppointmentStatus
  to: ISO8601Date
}

enum AppointmentStatus {
  """
  予約済
  """
  BOOKED

  """
  キャンセル
  """
  CANCELED

  """
  受付済
  """
  CHECKED_IN

  """
  診察済
  """
  COMPLETED

  """
  診察中
  """
  IN_CONSULTATION

  """
  無断キャンセル
  """
  NO_SHOW
}

"""
監査ログに残す操作
"""
enum AuditAction {
  """
  予約した
  """
  APPOINTMENT_BOOK

  """
  予約をキャンセルした
  """
  APPOINTMENT_CANCEL

  """
  受付した
  """
  APPOINTMENT_CHECK_IN

  """
  診察を終えた
  """
  APPOINTMENT_FINISH

  """
  無断キャンセルにした（定期の処理）
  """
  APPOINTMENT_NO_SHOW

  """
  予約の時刻を変えた
  """
  APPOINTMENT_RESCHEDULE

  """
  診察を始めた
  """
  APPOINTMENT_START

  """
  会計を確定した
  """
  BILL_CONFIRM

  """
  会計を支払い済にした
  """
  BILL_PAY

  """
  会計を返金済にした
  """
  BILL_REFUND

  """
  会計の明細を変えた
  """
  BILL_UPDATE_ITEMS

  """
  会計を見た
  """
  BILL_VIEW

  """
  問診を保存した
  """
  QUESTIONNAIRE_SAVE

  """
  問診を見た
  """
  QUESTIONNAIRE_VIEW
}

"""
監査ログの1件
"""
type AuditLog {
  action: AuditAction!

  """
  した人の種類。システム（定期の処理）のときは null
  """
