type Query {
  """
  予約の1件。見られない予約は null
  """
  appointment(id: ID!): Appointment

  """
  予約の一覧。患者は自分の予約、医師は自分が担当の予約、事務スタッフは自院の全部。枠の開始時刻の順
  """
  appointments(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    新しい順にする（過去の予約を見るとき）
    """
    descending: Boolean = false
    filter: AppointmentFilter

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): AppointmentConnection!

  """
  監査ログ。新しい順。見られるのは、自院の分を、管理者の事務スタッフだけ（ほかの人には空）
  """
  auditLogs(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): AuditLogConnection!

  """
  空いている診療枠。開始時刻の順
  """
  availableSlots(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
    clinicId: ID!
    doctorId: ID

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    この日から（日本時間）
    """
    from: ISO8601Date

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    この日まで（日本時間。この日を含む）
    """
    to: ISO8601Date
  ): SlotConnection!

  """
  会計の1件。事務スタッフは自院の会計、患者は自分の確定した会計
  """
  bill(id: ID!): Bill

  """
  医療機関の1件。医療機関と医師の名前は、ログインしていれば誰でも見られる
  """
  clinic(id: ID!): Clinic

  """
  医療機関の一覧（患者が予約する先を選ぶ）。数が少ない前提で、上限つきの並びで返す
  """
  clinics: [Clinic!]!

  """
  日ごと・医師ごとの集計。見られるのは、自院の分を、事務スタッフだけ（ほかの人には空）。期間は31日まで
  """
  dashboard(
    """
    この日から（日本時間）
    """
    from: ISO8601Date!

    """
    この日まで（日本時間。この日を含む）
    """
    to: ISO8601Date!
  ): [DashboardRow!]!

  """
  自院の料金の表（事務スタッフだけ。ほかの人には空）
  """
  feeItems: [FeeItem!]!

  """
  ログインしている人。ログインしていなければ null
  """
  me: Viewer
}

