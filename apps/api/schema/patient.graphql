"""
予約
"""
type Appointment {
  """
  会計。見られない人（医師、下書きのあいだの患者）と、まだない予約では null
  """
  bill: Bill

  """
  事務スタッフが、患者の代わりに入れた予約か
  """
  bookedByStaff: Boolean!

  """
  今、ログインしている人が問診に答えられるか
  """
  canAnswerQuestionnaire: Boolean!

  """
  今、ログインしている人がキャンセル・時刻の変更をできるか
  """
  canCancel: Boolean!

  """
  今、ログインしている人が受付できるか
  """
  canCheckIn: Boolean!
  canFinishConsultation: Boolean!
  canStartConsultation: Boolean!

  """
  今、ログインしている人が問診を見られるか（患者本人と、担当の医師）
  """
  canViewQuestionnaire: Boolean!
  canceledAt: ISO8601DateTime
  clinic: Clinic!
  id: ID!
  patient: Patient!

  """
  問診の答え。見られない人（事務スタッフなど）と、まだない予約では null
  """
  questionnaire: Questionnaire

  """
  この医療機関の、今の問診の質問。問診を見られない人には空
  """
  questionnaireQuestions: [QuestionnaireQuestion!]!
  slot: Slot!
  status: AppointmentStatus!
}

"""
The connection type for Appointment.
"""
type AppointmentConnection {
  """
  A list of edges.
  """
  edges: [AppointmentEdge]

  """
  A list of nodes.
  """
  nodes: [Appointment]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type AppointmentEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: Appointment
}

"""
予約の一覧の絞り込み。日付は日本時間で、from・to の日を含む
"""
input AppointmentFilter {
  doctorId: ID
  from: ISO8601Date
  status: AppointmentStatus
  to: ISO8601Date
}

enum AppointmentStatus {
  """
  予約済
  """
  BOOKED

  """
  キャンセル
  """
  CANCELED

  """
  受付済
  """
  CHECKED_IN

  """
  診察済
  """
  COMPLETED

  """
  診察中
  """
  IN_CONSULTATION

  """
  無断キャンセル
  """
  NO_SHOW
}

"""
会計
"""
type Bill {
  appointment: Appointment!
  billedAt: ISO8601DateTime

  """
  今、ログインしている人が、明細の変更・確定・支払い済・返金をできるか
  """
  canManage: Boolean!
  id: ID!
  items: [BillItem!]!
  paidAt: ISO8601DateTime
  refundedAt: ISO8601DateTime
  status: BillStatus!

  """
  合計（円）。確定のときに決まる。作成中は null
  """
  totalAmount: Int
}

"""
会計の明細。名前と値段は、作った時の料金の表から写したもの
"""
type BillItem {
  """
  単価 × 数量（円）
  """
  amount: Int!
  id: ID!
  name: String!
  quantity: Int!

  """
  円
  """
  unitPrice: Int!
}

enum BillStatus {
  """
  請求済
  """
  BILLED

  """
  作成中
  """
  DRAFT

  """
  支払い済
  """
  PAID

  """
  返金済
  """
  REFUNDED
}

"""
Autogenerated return type of BookAppointment.
"""
type BookAppointmentPayload {
  appointment: Appointment
  errors: [UserError!]!
}

"""
Autogenerated return type of CancelAppointment.
"""
type CancelAppointmentPayload {
  appointment: Appointment
  errors: [UserError!]!
}

"""
Autogenerated return type of CheckIn.
"""
type CheckInPayload {
  appointment: Appointment
  errors: [UserError!]!
}

"""
医療機関
"""
type Clinic {
  doctors: [Doctor!]!
  id: ID!
  name: String!
}

"""
医師
"""
type Doctor {
  id: ID!
  name: String!
}

"""
使う人が直せるエラーの種類
"""
enum ErrorCode {
  """
  キャンセル・変更できる期限を過ぎている
  """
  CANCEL_DEADLINE_PASSED

  """
  ほかの操作とぶつかった。もう一度試せば通ることがある
  """
  CONFLICT

  """
  メールアドレスかパスワードが違う
  """
  INVALID_CREDENTIALS

  """
  入力に誤りがある
  """
  INVALID_INPUT

  """
  今の状態では、その操作はできない
  """
  INVALID_STATE

  """
  対象が見つからない（ほかの医療機関・ほかの人のものも、見つからないとして返す）
  """
  NOT_FOUND

  """
  見えているが、その操作はできない
  """
  NOT_PERMITTED

  """
  受付できる時間の外
  """
  OUTSIDE_TIME_WINDOW

  """
  枠がすでに埋まっている
  """
  SLOT_TAKEN

  """
  枠の時刻を過ぎたか、閉じられていて、予約できない
  """
  SLOT_UNAVAILABLE
}

"""
An ISO 8601-encoded date
"""
scalar ISO8601Date @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

"""
An ISO 8601-encoded datetime
"""
scalar ISO8601DateTime @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

"""
Autogenerated return type of Login.
"""
type LoginPayload {
  errors: [UserError!]!
  viewer: Viewer
}

"""
Autogenerated return type of Logout.
"""
type LogoutPayload {
  errors: [UserError!]!
}

type Mutation {
  """
  空いている診療枠を予約する
  """
  bookAppointment(slotId: ID!): BookAppointmentPayload!

  """
  予約をキャンセルする
  """
  cancelAppointment(appointmentId: ID!): CancelAppointmentPayload!

  """
  受付（チェックイン）をする
  """
  checkIn(appointmentId: ID!): CheckInPayload!

  """
  ログイン。この入口の利用者（患者・事務スタッフ・医師のどれか）としてだけ、ログインできる
  """
  login(email: String!, password: String!): LoginPayload!

  """
  ログアウト。ログインしていなくても成功する
  """
  logout: LogoutPayload!

  """
  予約の時刻を変える（同じ医療機関の、空いている枠へ付け替える）
  """
  rescheduleAppointment(appointmentId: ID!, slotId: ID!): RescheduleAppointmentPayload!

  """
  問診の答えを保存する。submit が false なら途中まで保存、true なら提出（必須の質問を確かめる）
  """
  saveQuestionnaire(answers: [QuestionnaireAnswerInput!]!, appointmentId: ID!, submit: Boolean!): SaveQuestionnairePayload!
}

"""
Information about pagination in a connection.
"""
type PageInfo {
  """
  When paginating forwards, the cursor to continue.
  """
  endCursor: String

  """
  When paginating forwards, are there more items?
  """
  hasNextPage: Boolean!

  """
  When paginating backwards, are there more items?
  """
  hasPreviousPage: Boolean!

  """
  When paginating backwards, the cursor to continue.
  """
  startCursor: String
}

"""
患者
"""
type Patient {
  id: ID!
  name: String!
}

type Query {
  """
  予約の1件。見られない予約は null
  """
  appointment(id: ID!): Appointment

  """
  予約の一覧。患者は自分の予約、医師は自分が担当の予約、事務スタッフは自院の全部。枠の開始時刻の順
  """
  appointments(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    新しい順にする（過去の予約を見るとき）
    """
    descending: Boolean = false
    filter: AppointmentFilter

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): AppointmentConnection!

  """
  空いている診療枠。開始時刻の順
  """
  availableSlots(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
    clinicId: ID!
    doctorId: ID

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    この日から（日本時間）
    """
    from: ISO8601Date

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    この日まで（日本時間。この日を含む）
    """
    to: ISO8601Date
  ): SlotConnection!

  """
  会計の1件。事務スタッフは自院の会計、患者は自分の確定した会計
  """
  bill(id: ID!): Bill

  """
  医療機関の1件。医療機関と医師の名前は、ログインしていれば誰でも見られる
  """
  clinic(id: ID!): Clinic

  """
  医療機関の一覧（患者が予約する先を選ぶ）。数が少ない前提で、上限つきの並びで返す
  """
  clinics: [Clinic!]!

  """
  ログインしている人。ログインしていなければ null
  """
  me: Viewer
}

enum QuestionKind {
  """
  複数選択
  """
  MULTIPLE

  """
  選択（1つ）
  """
  SINGLE

  """
  文章
  """
  TEXT
}

"""
問診の答え（予約ごとに1つ）
"""
type Questionnaire {
  answers: [QuestionnaireAnswer!]!
  id: ID!

  """
  提出済か（false は、途中まで保存した下書き）
  """
  submitted: Boolean!
  submittedAt: ISO8601DateTime
}

"""
問診の答えの1つ。質問は、答えたときの写し
"""
type QuestionnaireAnswer {
  kind: QuestionKind!
  label: String!
  options: [String!]!
  questionId: ID!

  """
  複数選択の答え（ほかでは null）
  """
  selected: [String!]

  """
  文章・選択の答え（複数選択では null）
  """
  text: String
}

"""
問診の答えの1つ。文章・選択は text、複数選択は selected に入れる
"""
input QuestionnaireAnswerInput {
  questionId: ID!
  selected: [String!]
  text: String
}

"""
問診の質問
"""
type QuestionnaireQuestion {
  id: ID!
  kind: QuestionKind!
  label: String!
  options: [String!]!
  required: Boolean!
}

"""
Autogenerated return type of RescheduleAppointment.
"""
type RescheduleAppointmentPayload {
  appointment: Appointment
  errors: [UserError!]!
}

"""
Autogenerated return type of SaveQuestionnaire.
"""
type SaveQuestionnairePayload {
  appointment: Appointment
  errors: [UserError!]!
}

"""
診療枠
"""
type Slot {
  """
  今、ログインしている人が閉じられるか（予約が入っているかは、閉じるときに確かめる）
  """
  canClose: Boolean!
  clinic: Clinic!
  closedAt: ISO8601DateTime
  doctor: Doctor!
  endsAt: ISO8601DateTime!
  id: ID!
  startsAt: ISO8601DateTime!
}

"""
The connection type for Slot.
"""
type SlotConnection {
  """
  A list of edges.
  """
  edges: [SlotEdge]

  """
  A list of nodes.
  """
  nodes: [Slot]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type SlotEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: Slot
}

"""
使う人が直せるエラー。mutation の結果の errors に入る
"""
type UserError {
  code: ErrorCode!

  """
  入力のどの項目か（あれば）
  """
  field: String

  """
  画面にそのまま出せる文
  """
  message: String!
}

"""
ログインしている人
"""
type Viewer {
  """
  監査ログを見られるか（管理者の事務スタッフ）
  """
  canViewAuditLogs: Boolean!

  """
  所属の医療機関（患者は null）
  """
  clinic: Clinic
  id: ID!
  kind: ViewerKind!
  name: String!

  """
  スタッフとしての id（患者は null）。医師が自分の枠・予約を絞るのに使う
  """
  staffMemberId: ID
}

enum ViewerKind {
  """
  事務スタッフ
  """
  CLERK

  """
  医師
  """
  DOCTOR

  """
  患者
  """
  PATIENT
}
